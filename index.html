<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pra Você 💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ffd6e7, #ffeef5);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 420px;
      width: 100%;
      padding: 35px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
      animation: aparecer 1s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: #ff4f81;
      margin-bottom: 15px;
      font-size: 2.2rem;
    }

    p {
      color: #555;
      line-height: 1.7;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .heart {
      font-size: 3rem;
      animation: pulse 1.5s infinite;
      margin-bottom: 15px;
    }

    .foto {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    button {
      margin-top: 10px;
      padding: 14px 22px;
      border: none;
      border-radius: 15px;
      background: #ff4f81;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff2f6d;
      transform: scale(1.05);
    }

    .mensagem {
      margin-top: 25px;
      background: #fff0f5;
      padding: 18px;
      border-radius: 18px;
      display: none;
      animation: fade 0.6s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .floating-heart {
      position: absolute;
      color: rgba(255, 79, 129, 0.5);
      animation: subir 6s linear infinite;
      font-size: 20px;
    }

    @keyframes subir {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">💖</div>

    <!-- FOTO DO CASAL -->
    <img class="foto" src="eueela.jpg" alt="Nossa foto" />

    <h1>Oi meu Amo</h1>

    <p>
      Fiz esse site só pra te lembrar o quanto você é especial pra mim viu amo
    </p>

    <p>
      Você é toda perfeita meu amo
    </p>

    <button onclick="mostrarMensagem()">
      Clique aqui ❤️
    </button>

    <div class="mensagem" id="mensagem">
      <p>
        Eu amo seu sorriso, sua voz, seu jeitinho e tudo em vc sua gostosa delicia
      </p>

      <p>
        Sou dodin por vc ta bom ta bom
      </p>

      <p>
        Te amo pra sempre ♾️
      </p>
    </div>
  </div>

  <script>
    function mostrarMensagem() {
      document.getElementById('mensagem').style.display = 'block';
    }

    function criarCoracao() {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.innerHTML = '💖';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = Math.random() * 20 + 15 + 'px';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(criarCoracao, 500);
  </script>

</body>
</html>

</body>
</html>
